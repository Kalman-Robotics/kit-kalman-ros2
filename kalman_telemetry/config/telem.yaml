kalman_telemetry_node:
  ros__parameters:

    laser_scan:
      mask_radius_meters: 0.10
      # Sectores bloqueados por las antenas del robot, en pares [inicio, fin]
      # grados. Ademas del eco directo, las antenas producen reflexiones
      # especulares (el haz rebota, alcanza la pared y vuelve) que aparecen a
      # distancias falsas mayores y cambian de angulo segun el entorno, por lo
      # que mask_radius no basta: hay que descartar el sector completo.
      # Medidos con el robot quieto y mask_radius=0: dos antenas, con ecos
      # estables a 3.0-7.5 cm. Se anaden 4 grados de margen a cada lado para
      # cubrir tambien los rebotes rasantes en el canto de cada antena.
      # La antena 2 es mas gruesa, por eso lleva mas margen.
      #   antena 1: 26-50 deg   ->  22-54  (+4 por lado)
      #   antena 2: 120-135 deg -> 112-143 (+8 por lado)
      masked_sectors_deg: [22.0, 54.0, 112.0, 143.0]
      topic_name_pub: "scan"
      frame_id: "laser_link"
      discard_broken_scans: true
      lidar_model: "LDROBOT-LD19"

    lidar:
      model:            ['YDLIDAR-X4','XIAOMI-LDS02RR','YDLIDAR-X2-X2L','YDLIDAR-X3-PRO','YDLIDAR-X3','NEATO-XV11','SLAMTEC-RPLIDAR-A1','3IROBOTIX-DELTA-2G','3IROBOTIX-DELTA-2A','3IROBOTIX-DELTA-2B','LDROBOT-LD14P','LDROBOT-LD19','CAMSENSE-X1','YDLIDAR-SCL']
      angle_offset_deg: [         0.0,          -180.0,             0.0,             0.0,         0.0,      -180.0,              -180.0,               -90.0,               -90.0,               -90.0,            0.0,          0.0,         16.0,          0.0]
      pub_scan_size:    [         720,             360,             720,             720,         720,         360,                 720,                 360,                 720,                 360,            720,          360,          360,          720]
      clockwise:        [        true,            true,            true,            true,        true,       false,                true,                true,                true,                true,           true,         true,         true,         true]
      # LDROBOT-LD19 (indice 11): 0.08 en vez del 0.03 nominal del sensor.
      # Con 3 cm captaba la estructura del propio robot; 8 cm es el minimo
      # util real y es coherente con mask_radius_meters.
      range_min_meters: [        0.15,            0.15,             0.1,            0.12,        0.12,        0.15,                0.15,                0.15,                0.15,                 0.2,            0.1,         0.08,          0.1,         0.12]
      range_max_meters: [        12.0,             6.0,             8.0,             8.0,         8.0,         6.0,                12.0,                 5.0,                 8.0,                 8.0,            8.0,         12.0,          8.0,          8.0]
      intensity:        [       false,           false,           false,           false,       false,       false,               false,               false,               false,               false,          false,         true,        false,         true]
      # 'HLS-LFCD2', 'HLS-LFCD3', 'XIAOMI-LDS01RR', 'LDROBOT-LD20'
      #         0.0,         0.0,              0.0,
      #         360,         360,              360,
      #        true,        true,             true,
      #        0.12,        0.16,             0.15,
      #         3.5,         8.0,              9.0,

    telemetry:
      topic_name_sub: "telemetry"

    tf:
      frame_id: "odom"
      child_frame_id: "base_footprint"

    joints:
      topic_name_pub: "joint_states"
      wheel:
        right: "wheel_right_joint"
        left: "wheel_left_joint"

    odometry:
      frame_id: "odom"
      child_frame_id: "base_footprint"
      topic_name_pub: "odom"

    battery:
      topic_name_pub: "battery_state"
      voltage_full: 4.1
      voltage_empty: 3.5

    wifi:
      topic_name_pub: "wifi_state"
