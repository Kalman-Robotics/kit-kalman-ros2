version: '3.7'
services:

  development_server:
    hostname: development
    build:
      context: .
      dockerfile: ros2_docker
      args:
        SIMULATOR: classic
        ROS_DISTRO: humble
    container_name: kalman_development_container
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1 # disable MIT-SHM to improve X11 applications
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./.devcontainer/.vscode:/ros2_ws/.vscode:ro
      # - ./volume:/ros2_ws/src
      - ./kalman:/ros2_ws/src/kalman
      - ./kalman_bringup:/ros2_ws/src/kalman_bringup
      - ./kalman_description:/ros2_ws/src/kalman_description
      - ./kalman_gazebo:/ros2_ws/src/kalman_gazebo
      - ./kalman_interfaces:/ros2_ws/src/kalman_interfaces
      - ./kalman_telemetry:/ros2_ws/src/kalman_telemetry
      - ./kalman_teleop:/ros2_ws/src/kalman_teleop
      - ./kalman_imu:/ros2_ws/src/kalman_imu
      - ./README.md:/ros2_ws/README.md       
    networks:
      ros2_network:
    # command: tail -f /dev/null
    command: /bin/bash -c "/docker_commands/setup.sh && tail -f /dev/null"

networks:
  ros2_network: